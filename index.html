<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Elite</title>
    <link rel="stylesheet" href="./css/home.css">
</head>

<body>
    <header>
        <div class="home-logo">
            <img src="./assets/APEX ELITE.png" alt="logo">
            <h1>APEX ELITE</h1>
        </div>

        <ul class="nav-options">
            <li class="active">COLLECTION</li>
            <li>NEW ARRIVALS</li>
            <li>PERFORMANCE</li>
            <li>ABOUT</li>
            <li>CONTACT</li>
        </ul>

        <div class="nav-actions">

            <div class="action-icon">
                <img src="./assets/icons/search.png" alt="search">
            </div>

            <div class="action-icon">
                <img src="./assets/icons/favourites.png" alt="favourites">
            </div>

            <div class="action-icon cart-icon">
                <img src="./assets/icons/cart-home.png" alt="cart">
                <span>1</span>
            </div>

            <div class="action-icon">
                <img src="./assets/icons/profile.png" alt="profile">
            </div>

        </div>

    </header>

    <main>

        <div class="hero-section">
            <img src="./assets/items/home-hero.png" alt="home-hero">
            <div class="top-data">
                <h1>EVERY STEP. <span class="span-head">EVERY VICTORY.</span></h1>
                <p>Premium performance footwear engineered for speed, comfort, and
                confidence. Experience the zenith of athletic engineering.</p>
                <div class="button-div">
                    <button class="shop-btn">SHOP COLLECTION</button>
                    <button class="explore-btn">EXPLORE TECHNOLOGY</button>
                </div>
            </div>
        </div>

        <div class="featured-collection">
            <div class="featured-head">
                <p>THE ELITE SERIES</p>
                <h1>FEATURED COLLECTION</h1>
            </div>
            <div class="featured-cards">

            </div>
        </div>
    </main>

    <script type="module" src="./js/home.js"></script>
</body>

</html>
