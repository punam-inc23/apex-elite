<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product</title>

    <link rel="stylesheet" href="../../css/product/product.css">
</head>

<body>

    <header>
        <div class="home-logo">
            <img src="../../assets/APEX ELITE.png" alt="logo">
            <h1>APEX ELITE</h1>
        </div>
    
        <ul class="nav-options">
            <li class="active">SHOP</li>
            <li>PERFORMANCE</li>
            <li>LIFESTYLE</li>
            <li>HERITAGE</li>
        </ul>
    
        <div class="nav-actions">
    
            <div class="action-icon">
                <img src="../../assets/icons/search.png" alt="search">
            </div>
    
            <div class="action-icon">
                <img src="../../assets/icons/favourites.png" alt="favourites">
            </div>
    
            <div class="action-icon cart-icon">
                <img src="../../assets/icons/cart-home.png" alt="cart">
                <span>1</span>
            </div>
    
            <div class="action-icon">
                <img src="../../assets/icons/profile.png" alt="profile">
            </div>
    
        </div>
    
    </header>

    <div class="product-detail">

        <div class="product-image">
            <img id="product-image" src="" alt="">
        </div>

        <div class="product-info">
            <p id="product-category">PRO TRAIL SERIES</p>
            <h1 id="product-name"></h1>
            <h2 id="product-price"></h2>
            <p id="product-description"></p>

            <div class="size-header">
                <p>SELECT SIZE (US MEN'S)</p>
                <p id="size-guide">SIZE GUIDE</p>
            </div>

            <div id="product-sizes" class="product-sizes"></div>

            <button id="add-to-bag" class="add-button">
                ADD TO BAG
            </button>

            <button class="store-button">
                FIND IN STORE
            </button>

            <div class="product-features">

                <div>
                    <p class="subhead-category">CUSHION</p>
                    <span id="product-cushion">FIRM / RESPONSIVE</span>
                </div>

                <div>
                    <p class="subhead-category">SURFACE</p>
                    <span id="product-surface">ALL-TERRAIN</span>
                </div>

                <div>
                    <p class="subhead-category">DROP</p>
                    <span id="product-drop">6MM</span>
                </div>

            </div>

        </div>

    </div>


    <script type="module" src="../../js/product/product.js"></script>

</body>

</html>
